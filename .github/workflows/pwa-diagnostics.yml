name: PWA diagnostics

on:
  push:
    branches:
      - custom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for public service worker deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' https://tv.zeptol.qzz.io/sw.js || true)
            echo "attempt=${attempt} sw_status=${status}"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Service worker never became publicly accessible.' >&2
          exit 1

      - name: Fetch production PWA resources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/pwa-check
          cd /tmp/pwa-check

          curl --retry 3 --retry-delay 5 -sS -D root-initial.headers https://tv.zeptol.qzz.io/ -o root-initial.body
          curl --retry 3 --retry-delay 5 -fsSL -D root-final.headers https://tv.zeptol.qzz.io/ -o index.html
          curl --retry 3 --retry-delay 5 -fsS -D manifest.headers https://tv.zeptol.qzz.io/manifest.json -o manifest.json
          curl --retry 3 --retry-delay 5 -fsS -D sw.headers https://tv.zeptol.qzz.io/sw.js -o sw.js

          echo '===== ROOT INITIAL HEADERS ====='
          cat root-initial.headers
          echo '===== ROOT FINAL HEADERS ====='
          cat root-final.headers
          echo '===== MANIFEST HEADERS ====='
          cat manifest.headers
          echo '===== SERVICE WORKER HEADERS ====='
          cat sw.headers
          echo '===== LINKED MANIFEST ====='
          grep -i -oE '<link[^>]+manifest[^>]*>' index.html || true
          echo '===== MANIFEST ====='
          jq . manifest.json
          echo '===== SERVICE WORKER SIZE / FETCH ROUTES ====='
          wc -c sw.js
          grep -Eo 'fetch|registerRoute|precacheAndRoute' sw.js | sort | uniq -c || true

      - name: Validate manifest icons
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/pwa-check
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          for (const [index, icon] of (manifest.icons || []).entries()) {
            const url = new URL(icon.src, 'https://tv.zeptol.qzz.io/').href;
            const out = `icon-${index}.png`;
            execFileSync('curl', ['--retry', '3', '--retry-delay', '3', '-fsS', '-D', `${out}.headers`, url, '-o', out], { stdio: 'inherit' });
            console.log(`===== ICON ${index}: ${url} =====`);
            console.log(fs.readFileSync(`${out}.headers`, 'utf8'));
            execFileSync('file', [out], { stdio: 'inherit' });
          }
          NODE

      - name: Run Lighthouse PWA audit
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/pwa-check
          npx --yes lighthouse@11.7.1 https://tv.zeptol.qzz.io/login \
            --only-categories=pwa \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --output=json \
            --output-path=lighthouse.json \
            --quiet
          node <<'NODE'
          const report = require('/tmp/pwa-check/lighthouse.json');
          const ids = [
            'is-on-https',
            'service-worker',
            'installable-manifest',
            'splash-screen',
            'themed-omnibox',
            'maskable-icon',
            'works-offline',
            'viewport',
          ];
          for (const id of ids) {
            const audit = report.audits[id];
            if (!audit) continue;
            console.log(JSON.stringify({ id, score: audit.score, title: audit.title, displayValue: audit.displayValue, explanation: audit.explanation, details: audit.details }, null, 2));
          }
          NODE
